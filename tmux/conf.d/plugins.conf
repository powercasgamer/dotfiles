# Managed by TPM (tmux-plugins/tpm), installed by ../setup.sh.
# Add/remove plugins here, then <prefix> + I inside tmux to install new ones.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'

# tmux-resurrect/continuum: auto-save session layout every 15 min and
# restore it on tmux start, so accidental server restarts aren't fatal.
set -g @continuum-restore 'on'

# must be the last line
run '~/.tmux/plugins/tpm/tpm'
