# --- general behavior ---
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g escape-time 10
set -g history-limit 50000
set -g focus-events on
set -g mode-keys vi

# --- true color support ---
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# --- Claude Code & other modern TUIs ---
# Forward modified keys (e.g. Shift+Enter for a newline in Claude Code) as
# CSI-u sequences instead of collapsing them to plain Enter.
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'
# OSC 52: clipboard writes from inside a pane (Claude's /copy, yanks over SSH)
# reach the outer terminal's clipboard.
set -g set-clipboard on
# OSC 8: clickable file paths and URLs.
set -as terminal-features ',*:hyperlinks'
# Let escape sequences tmux doesn't understand (desktop notifications) through.
set -g allow-passthrough on
