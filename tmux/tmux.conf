# ~/dotfiles/tmux/tmux.conf
# Symlinked to ~/.tmux.conf by dotfiles/tmux/setup.sh — keep machine-specific
# stuff out of this file.
#
# Sourced explicitly (not globbed) so load order is guaranteed: plugins.conf
# must run last, since TPM's own init line has to be the final line tmux
# processes.

source-file -q ~/dotfiles/tmux/conf.d/options.conf
source-file -q ~/dotfiles/tmux/conf.d/bindings.conf
source-file -q ~/dotfiles/tmux/conf.d/statusbar.conf
source-file -q ~/dotfiles/tmux/conf.d/plugins.conf
