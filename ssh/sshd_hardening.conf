# Portable sshd hardening defaults, installed to
# /etc/ssh/sshd_config.d/99-dotfiles-hardening.conf by ssh/harden-server.sh.
#
# Deliberately excludes PasswordAuthentication -- disabling it with no
# ~/.ssh/authorized_keys configured would lock out remote access entirely.
# Add your key(s) to authorized_keys on this machine, confirm key-based
# login actually works from another terminal, THEN uncomment the line at
# the bottom yourself.
#
# Also deliberately does not pin Ciphers/KexAlgorithms/MACs -- see the
# matching note in ssh/ssh_config for why.

PermitRootLogin no
PubkeyAuthentication yes
MaxAuthTries 3
LoginGraceTime 30
ClientAliveInterval 300
ClientAliveCountMax 2
X11Forwarding no
AllowAgentForwarding no
PermitEmptyPasswords no

# Uncomment once key-based login is confirmed working for every account
# that needs remote access to this machine:
#PasswordAuthentication no
