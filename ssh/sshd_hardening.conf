# Portable sshd hardening defaults, installed to
# /etc/ssh/sshd_config.d/10-dotfiles-hardening.conf by ssh/harden-server.sh.
# 10- so it's read before provider drop-ins like 50-cloud-init.conf: sshd
# keeps the first value it reads for each option.
#
# Deliberately excludes PasswordAuthentication -- disabling it with no
# ~/.ssh/authorized_keys configured would lock out remote access entirely.
# Add your key(s) to authorized_keys on this machine, confirm key-based
# login actually works from another terminal, THEN uncomment the line at
# the bottom yourself.
#
# Also deliberately does not pin Ciphers/KexAlgorithms/MACs -- see the
# matching note in ssh/ssh_config for why.

PermitRootLogin no
PubkeyAuthentication yes
MaxAuthTries 3
LoginGraceTime 30
ClientAliveInterval 300
ClientAliveCountMax 2
X11Forwarding no
AllowAgentForwarding no
PermitEmptyPasswords no
PermitTunnel no
PermitUserEnvironment no

# Uncomment once key-based login is confirmed working for every account
# that needs remote access to this machine. All three together: with only
# PasswordAuthentication off, keyboard-interactive (PAM) can still ask for
# a password.
#PasswordAuthentication no
#KbdInteractiveAuthentication no
#AuthenticationMethods publickey

# Optional, for servers nobody tunnels through (breaks ssh -L/-R/-D):
#AllowTcpForwarding no
