name: Lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # shellcheck ships preinstalled on GitHub-hosted ubuntu runners.
      # Only *.sh (bash) is checked -- the *.zsh files are sourced snippets,
      # not scripts, and use zsh syntax shellcheck doesn't understand.
      - name: ShellCheck
        run: find . -name '*.sh' -not -path './.git/*' -print0 | xargs -0 shellcheck
